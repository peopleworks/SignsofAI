<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(620px 520px at 88% 8%,rgba(47,210,122,.16),transparent 60%),
   radial-gradient(700px 620px at 6% 92%,rgba(219,39,119,.22),transparent 60%),
   radial-gradient(680px 560px at 20% -8%,rgba(109,124,255,.22),transparent 60%),
   linear-gradient(155deg,#0b1020,#0d1428 55%,#121c33);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:52px;top:44px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:38px}
.bmark{width:52px;height:52px;border-radius:14px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 34px rgba(109,124,255,.5)}
.title{position:absolute;top:118px;left:0;width:100%;text-align:center;font-size:112px;font-weight:900;letter-spacing:-2px;line-height:1;
 text-shadow:0 6px 30px rgba(0,0,0,.5)}
.title .ia{color:#f0556f} .title .hu{color:#2fd27a}
.stampwrap{position:absolute;left:96px;top:326px;transform:rotate(-8deg)}
.stamp{border:11px solid #f0556f;color:#f0556f;border-radius:24px;padding:22px 48px;font-weight:900;font-size:104px;line-height:1;
 box-shadow:0 0 60px rgba(240,85,111,.35) inset;text-shadow:0 3px 16px rgba(240,85,111,.4)}
.crack{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.slabel{margin-top:22px;text-align:center;font-size:34px;font-weight:800;color:#9fb0cc;letter-spacing:1px}
.arrow{position:absolute;left:642px;top:396px;font-size:76px;font-weight:900;color:#6d7cff;text-shadow:0 4px 20px rgba(109,124,255,.5)}
.answer{position:absolute;left:720px;top:322px;width:470px}
.answer .big{font-size:62px;font-weight:900;line-height:1.05}
.answer .big b{background:linear-gradient(90deg,#f59e0b,#2fd27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{margin-top:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px 22px}
.ln{height:14px;border-radius:7px;margin:14px 0;background:rgba(255,255,255,.14)}
.hlp{background:linear-gradient(90deg,rgba(219,39,119,.7),rgba(219,39,119,.3))}
.hla{background:linear-gradient(90deg,rgba(245,158,11,.7),rgba(245,158,11,.3))}
.hlc{background:linear-gradient(90deg,rgba(34,184,207,.7),rgba(34,184,207,.3))}
.foot{position:absolute;left:0;bottom:40px;width:100%;text-align:center;font-size:38px;font-weight:800;color:#cdd8ec}
.foot b{color:#2fd27a} .foot .dot{color:#4a5772;margin:0 14px}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="title"><span class="ia">AI</span> or <span class="hu">HUMAN</span>?</div>

<div class="stampwrap">
 <div class="stamp">87% AI</div>
 <svg class="crack" viewBox="0 0 460 250"><polyline points="150,-10 200,90 150,120 220,260" fill="none" stroke="#eaf1fb" stroke-width="7" opacity=".9"/></svg>
 <div class="slabel">a number is not evidence</div>
</div>

<div class="arrow">&rarr;</div>
<div class="answer">
 <div class="big">It shows you <b>THE EVIDENCE</b></div>
 <div class="card">
  <div class="ln hlp" style="width:82%"></div>
  <div class="ln" style="width:96%"></div>
  <div class="ln hla" style="width:64%"></div>
  <div class="ln hlc" style="width:88%"></div>
 </div>
</div>

<div class="foot"><b>Free</b><span class="dot">&bull;</span>Explainable &amp; bilingual<span class="dot">&bull;</span>In your browser</div>
</body></html>
