<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(620px 520px at 88% 8%,rgba(47,210,122,.16),transparent 60%),
   radial-gradient(700px 620px at 6% 92%,rgba(219,39,119,.22),transparent 60%),
   radial-gradient(680px 560px at 20% -8%,rgba(109,124,255,.22),transparent 60%),
   linear-gradient(155deg,#0b1020,#0d1428 55%,#121c33);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:52px;top:44px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:38px}
.bmark{width:52px;height:52px;border-radius:14px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 34px rgba(109,124,255,.5)}
.title{position:absolute;top:112px;left:0;width:100%;text-align:center;font-size:96px;font-weight:900;letter-spacing:-2px;line-height:1;
 text-shadow:0 6px 30px rgba(0,0,0,.5)}
.title b{background:linear-gradient(90deg,#f59e0b,#2fd27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.stampwrap{position:absolute;left:96px;top:306px;transform:rotate(-8deg)}
.stamp{border:11px solid #f0556f;color:#f0556f;border-radius:24px;padding:22px 48px;font-weight:900;font-size:96px;line-height:1;
 box-shadow:0 0 60px rgba(240,85,111,.35) inset;text-shadow:0 3px 16px rgba(240,85,111,.4)}
.crack{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.slabel{margin-top:22px;text-align:center;font-size:32px;font-weight:800;color:#9fb0cc;letter-spacing:1px}
.arrow{position:absolute;left:618px;top:380px;font-size:76px;font-weight:900;color:#6d7cff;text-shadow:0 4px 20px rgba(109,124,255,.5)}
.answer{position:absolute;left:712px;top:306px;width:490px}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:16px;
 padding:16px 22px;margin-bottom:16px;font-size:28px;font-weight:800}
.chip.a{color:#ffd9a1;border-color:rgba(245,158,11,.5)}
.chip.b{color:#a9e7f2;border-color:rgba(34,184,207,.5)}
.chip.c{color:#c4f5d8;border-color:rgba(47,210,122,.5)}
.foot{position:absolute;left:0;bottom:40px;width:100%;text-align:center;font-size:38px;font-weight:800;color:#cdd8ec}
.foot b{color:#2fd27a} .foot .dot{color:#4a5772;margin:0 14px}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="title">Welcome, <b>PROFESSOR</b></div>

<div class="stampwrap">
 <div class="stamp">87% AI</div>
 <svg class="crack" viewBox="0 0 460 250"><polyline points="150,-10 200,90 150,120 220,260" fill="none" stroke="#eaf1fb" stroke-width="7" opacity=".9"/></svg>
 <div class="slabel">you can't act on this</div>
</div>

<div class="arrow">&rarr;</div>
<div class="answer">
 <div class="chip a">a bibliography that contradicts itself</div>
 <div class="chip b">a foreign character &middot; line 14</div>
 <div class="chip c">the student's own baseline</div>
</div>

<div class="foot"><b>Free</b><span class="dot">&bull;</span>Nothing leaves your laptop<span class="dot">&bull;</span>EN/ES</div>
</body></html>
