<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(680px 420px at 82% -12%,rgba(219,39,119,.15),transparent 60%),
   radial-gradient(680px 420px at 12% -8%,rgba(109,124,255,.18),transparent 60%),
   linear-gradient(160deg,#0b1020,#111a2e);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.bmark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@keyframes rv{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.title{position:absolute;top:92px;width:100%;text-align:center;font-size:42px;font-weight:800;opacity:0;animation:rv .7s .2s forwards}
.editor{position:absolute;left:120px;top:210px;width:520px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:28px 30px;opacity:0;animation:rv .7s .6s forwards}
.line{height:13px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.05));margin:16px 0}
.hl{background:linear-gradient(90deg,rgba(219,39,119,.5),rgba(219,39,119,.2))}
.hl2{background:linear-gradient(90deg,rgba(245,158,11,.5),rgba(245,158,11,.2))}
.chips{position:absolute;left:710px;top:210px;width:440px;display:flex;flex-direction:column;gap:18px}
.chip{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 20px;font-size:26px;font-weight:700;opacity:0}
.dot{width:20px;height:20px;border-radius:50%}
.chip .ck{margin-left:auto;font-size:24px;color:#2fd27a;font-weight:900}
.c1{animation:pop .5s 1.2s forwards} .c2{animation:pop .5s 1.7s forwards}
.c3{animation:pop .5s 2.2s forwards} .c4{animation:pop .5s 2.7s forwards}
.cap{position:absolute;bottom:56px;width:100%;text-align:center;font-size:28px;color:#b9c6de;opacity:0;animation:rv .7s 3.3s forwards}
.cap b{color:#fff}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="title">It flags the tells of AI — <b>and how to fix them</b></div>
<div class="editor">
 <div class="line" style="width:96%"></div>
 <div class="line hl" style="width:52%"></div>
 <div class="line" style="width:100%"></div>
 <div class="line hl2" style="width:64%"></div>
 <div class="line" style="width:90%"></div>
 <div class="line" style="width:74%"></div>
</div>
<div class="chips">
 <div class="chip c1"><span class="dot" style="background:#db2777"></span>Lexical<span class="ck">✓</span></div>
 <div class="chip c2"><span class="dot" style="background:#f59e0b"></span>Rhetorical<span class="ck">✓</span></div>
 <div class="chip c3"><span class="dot" style="background:#22b8cf"></span>Syntactic<span class="ck">✓</span></div>
 <div class="chip c4"><span class="dot" style="background:#f0556f"></span>Statistical<span class="ck">✓</span></div>
</div>
<div class="cap">It's a <b>linter</b>, not a verdict.</div>
</body></html>
