<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(680px 420px at 82% -12%,rgba(34,184,207,.14),transparent 60%),
   radial-gradient(680px 420px at 12% -8%,rgba(109,124,255,.18),transparent 60%),
   linear-gradient(160deg,#0b1020,#111a2e);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.bmark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@keyframes rv{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes hl{from{background-position:100% 0}to{background-position:0 0}}
@keyframes dash{to{stroke-dashoffset:0}}
.title{position:absolute;top:92px;width:100%;text-align:center;font-size:40px;font-weight:800;opacity:0;animation:rv .7s .2s forwards}
.doc{position:absolute;top:210px;width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:26px 26px;opacity:0}
.left{left:120px;animation:rv .7s .6s forwards}
.right{left:760px;animation:rv .7s 1s forwards}
.doc .t{font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#96a8c6;margin-bottom:16px}
.ln{height:12px;border-radius:6px;background:rgba(255,255,255,.10);margin:14px 0}
.match{height:16px;border-radius:6px;margin:14px 0;
 background:linear-gradient(90deg,rgba(34,184,207,.55),rgba(34,184,207,.2),rgba(34,184,207,.55));
 background-size:200% 100%;animation:hl 1s 1.6s both}
svg.link{position:absolute;left:520px;top:300px;width:240px;height:120px;overflow:visible}
svg.link path{fill:none;stroke:#22b8cf;stroke-width:3;stroke-dasharray:6 8;stroke-dashoffset:300;animation:dash 1.2s 1.8s forwards}
.cap{position:absolute;bottom:100px;width:100%;text-align:center;font-size:30px;font-weight:700;opacity:0;animation:rv .7s 2.4s forwards}
.cap .a{color:#22b8cf}
.sub{position:absolute;bottom:56px;width:100%;text-align:center;font-size:22px;color:#b9c6de;opacity:0;animation:rv .7s 2.7s forwards}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="title">Did they write it, or copy it?</div>
<div class="doc left">
 <div class="t">Document A</div>
 <div class="ln" style="width:96%"></div>
 <div class="match" style="width:90%"></div>
 <div class="ln" style="width:80%"></div>
 <div class="ln" style="width:88%"></div>
</div>
<div class="doc right">
 <div class="t">Document B</div>
 <div class="ln" style="width:90%"></div>
 <div class="ln" style="width:84%"></div>
 <div class="match" style="width:92%"></div>
 <div class="ln" style="width:76%"></div>
</div>
<svg class="link"><path d="M0,20 C120,20 120,90 240,90"></path></svg>
<div class="cap">The <span class="a">evidence</span> is the score — a human judges.</div>
<div class="sub">Verbatim copies and paraphrases · even across languages</div>
</body></html>
