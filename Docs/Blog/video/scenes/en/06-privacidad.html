<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(680px 420px at 82% -12%,rgba(47,210,122,.14),transparent 60%),
   radial-gradient(680px 420px at 12% -8%,rgba(109,124,255,.18),transparent 60%),
   linear-gradient(160deg,#0b1020,#111a2e);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.bmark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@keyframes rv{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.title{position:absolute;top:96px;width:100%;text-align:center;font-size:42px;font-weight:800;opacity:0;animation:rv .7s .2s forwards}
.win{position:absolute;left:340px;top:200px;width:600px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden;opacity:0;animation:rv .7s .6s forwards}
.bar{display:flex;align-items:center;gap:10px;padding:16px 20px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1)}
.dotr{width:13px;height:13px;border-radius:50%}
.url{margin-left:14px;flex:1;background:rgba(0,0,0,.25);border-radius:8px;padding:8px 14px;font-family:Consolas,monospace;font-size:18px;color:#bfe9cf;display:flex;align-items:center;gap:10px}
.body{padding:44px 30px 34px;text-align:center}
.lock{width:52px;height:44px;border:5px solid #2fd27a;border-radius:9px;position:relative;margin:0 auto 8px}
.lock::before{content:"";position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:30px;height:30px;border:5px solid #2fd27a;border-bottom:none;border-radius:16px 16px 0 0}
.lock::after{content:"";position:absolute;left:50%;top:12px;transform:translateX(-50%);width:9px;height:14px;background:#2fd27a;border-radius:3px}
.ulock{width:15px;height:12px;border:2px solid #bfe9cf;border-radius:3px;position:relative;display:inline-block;flex:none}
.ulock::before{content:"";position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:9px;height:9px;border:2px solid #bfe9cf;border-bottom:none;border-radius:5px 5px 0 0}
.big{font-size:34px;font-weight:800;margin:14px 0 6px}
.pills{display:flex;gap:14px;justify-content:center;margin-top:22px}
.pill{padding:10px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.16);font-weight:700;font-size:22px;opacity:0}
.p1{animation:pop .5s 1.4s forwards} .p2{animation:pop .5s 1.8s forwards} .p3{animation:pop .5s 2.2s forwards}
.ok{color:#2fd27a}
.tech{position:absolute;bottom:56px;width:100%;text-align:center;font-size:24px;color:#b9c6de;opacity:0;animation:rv .7s 2.8s forwards}
.tech b{color:#6d7cff}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="title">It all runs in <b>your browser</b></div>
<div class="win">
 <div class="bar"><span class="dotr" style="background:#f0556f"></span><span class="dotr" style="background:#f59e0b"></span><span class="dotr" style="background:#2fd27a"></span>
  <span class="url"><span class="ulock"></span> peopleworks.github.io/SignsofAI</span></div>
 <div class="body">
  <div class="lock"></div>
  <div class="big">Your documents never leave your device</div>
  <div class="pills">
   <span class="pill p1 ok">0 servers</span>
   <span class="pill p2 ok">0 uploads</span>
   <span class="pill p3 ok">0 accounts</span>
  </div>
 </div>
</div>
<div class="tech">Rules and statistics — not a neural black box · <b>.NET 10 · Blazor WASM</b></div>
</body></html>
