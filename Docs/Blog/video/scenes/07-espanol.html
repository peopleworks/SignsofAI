<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(680px 420px at 82% -12%,rgba(219,39,119,.16),transparent 60%),
   radial-gradient(680px 420px at 12% -8%,rgba(109,124,255,.18),transparent 60%),
   linear-gradient(160deg,#0b1020,#111a2e);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.bmark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@keyframes rv{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}70%{transform:scale(1.1) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.title{position:absolute;top:92px;width:100%;text-align:center;font-size:40px;font-weight:800;opacity:0;animation:rv .7s .2s forwards}
.pack{position:absolute;top:210px;width:440px;background:#0a1223;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:22px 24px;font-family:'Cascadia Code',Consolas,monospace;font-size:19px;line-height:1.9;opacity:0}
.left{left:110px;animation:rv .7s .7s forwards}
.right{left:700px;border-color:rgba(219,39,119,.5);box-shadow:0 0 50px rgba(219,39,119,.18);animation:rv .7s 1.2s forwards}
.pack .fn{color:#96a8c6;font-size:16px;margin-bottom:12px;letter-spacing:1px}
.k{color:#22b8cf} .s{color:#f59e0b} .p{color:#db2777}
.dim{color:#6f7f9c}
.seal{position:absolute;left:840px;top:170px;background:linear-gradient(90deg,#db2777,#f59e0b);color:#0b1020;font-weight:900;font-size:20px;padding:12px 20px;border-radius:12px;transform:rotate(-6deg);opacity:0;animation:pop .6s 1.8s forwards;box-shadow:0 10px 30px rgba(219,39,119,.35)}
.cap{position:absolute;bottom:54px;width:100%;text-align:center;font-size:26px;color:#b9c6de;opacity:0;animation:rv .7s 2.4s forwards}
.cap b{color:#fff}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="title">El español, ciudadano de <b>primera</b></div>
<div class="pack left">
 <div class="fn">rules.en.json</div>
 <div><span class="dim">{</span> <span class="k">"term"</span>: <span class="s">"delve"</span>,</div>
 <div><span class="k">"suggestion"</span>: <span class="s">"explore"</span> <span class="dim">}</span></div>
 <div><span class="dim">{</span> <span class="k">"term"</span>: <span class="s">"tapestry"</span> <span class="dim">}</span></div>
</div>
<div class="pack right">
 <div class="fn">rules.es.json</div>
 <div><span class="dim">{</span> <span class="k">"term"</span>: <span class="p">"sumérgete"</span>,</div>
 <div><span class="k">"suggestion"</span>: <span class="p">"explora"</span> <span class="dim">}</span></div>
 <div><span class="dim">{</span> <span class="k">"term"</span>: <span class="p">"cabe destacar"</span> <span class="dim">}</span></div>
</div>
<div class="seal">derivado desde cero</div>
<div class="cap">Ninguna herramienta solo-inglés lo copia <b>traduciendo una lista</b>.</div>
</body></html>
