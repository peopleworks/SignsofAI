<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(680px 420px at 82% -12%,rgba(34,184,207,.15),transparent 60%),
   radial-gradient(680px 420px at 12% -8%,rgba(109,124,255,.18),transparent 60%),
   linear-gradient(160deg,#0b1020,#111a2e);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.bmark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@keyframes rv{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(240,85,111,.8)}100%{box-shadow:0 0 0 22px rgba(240,85,111,0)}}
.kick{position:absolute;top:88px;width:100%;text-align:center;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#22b8cf;font-weight:800;opacity:0;animation:rv .6s .2s forwards}
.title{position:absolute;top:118px;width:100%;text-align:center;font-size:40px;font-weight:800;opacity:0;animation:rv .7s .4s forwards}
.word{position:absolute;left:0;top:250px;width:100%;text-align:center;font-family:'Cascadia Code',Consolas,monospace;
 font-size:98px;font-weight:700;letter-spacing:4px;opacity:0;animation:rv .7s 1.4s forwards}
.word .bad{position:relative;display:inline-block;color:#f0556f;border:3px solid #f0556f;border-radius:12px;padding:0 6px;
 animation:ring 1.6s 2.8s ease-out 3}
.pos{position:absolute;left:0;top:396px;width:100%;text-align:center;font-size:24px;font-weight:800;color:#b9c6de;
 opacity:0;animation:rv .6s 3.2s forwards}
.pos b{color:#eaf1fb;background:rgba(34,184,207,.18);border:1px solid rgba(34,184,207,.5);border-radius:10px;padding:4px 14px}
.cards{position:absolute;left:0;bottom:78px;width:100%;display:flex;justify-content:center;gap:30px}
.uc{width:400px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:16px;
 padding:20px 24px;opacity:0;animation:rv .55s forwards}
.u1{animation-delay:4.4s;border-color:rgba(240,85,111,.55)}
.u2{animation-delay:5.2s;border-color:rgba(47,210,122,.5)}
.uc .cp{font-family:'Cascadia Code',Consolas,monospace;font-size:30px;font-weight:800}
.u1 .cp{color:#f0556f}.u2 .cp{color:#2fd27a}
.uc .nm{font-size:19px;color:#b9c6de;margin-top:6px;letter-spacing:1px}
.foot{position:absolute;left:0;bottom:24px;width:100%;text-align:center;font-size:24px;font-weight:800;color:#cdd8ec;
 opacity:0;animation:rv .6s 6.4s forwards}
.foot b{color:#22b8cf}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="kick">Segundo &middot; los caracteres</div>
<div class="title">Un car&aacute;cter est&aacute; o no est&aacute;</div>

<div class="word"><span class="bad">&#1072;</span>n&aacute;lisis</div>
<div class="pos">posici&oacute;n exacta: <b>l&iacute;nea 14 &middot; columna 1</b></div>

<div class="cards">
 <div class="uc u1"><div class="cp">U+0430</div><div class="nm">CYRILLIC SMALL LETTER A &middot; lo que hay</div></div>
 <div class="uc u2"><div class="cp">U+0061</div><div class="nm">LATIN SMALL LETTER A &middot; lo que deber&iacute;a</div></div>
</div>

<div class="foot">Escribiendo no se produce. <b>Es la firma de una herramienta.</b></div>
</body></html>
