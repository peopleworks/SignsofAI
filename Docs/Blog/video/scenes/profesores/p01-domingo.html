<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(680px 420px at 82% -12%,rgba(240,85,111,.16),transparent 60%),
   radial-gradient(680px 420px at 12% -8%,rgba(109,124,255,.18),transparent 60%),
   linear-gradient(160deg,#0b1020,#111a2e);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.bmark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@keyframes rv{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-14deg)}60%{transform:scale(1.1) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fan{from{opacity:0;transform:translateY(30px) rotate(0deg)}to{opacity:1;transform:none}}
.kick{position:absolute;top:88px;width:100%;text-align:center;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#6d7cff;font-weight:800;opacity:0;animation:rv .6s .2s forwards}
.title{position:absolute;top:118px;width:100%;text-align:center;font-size:38px;font-weight:800;opacity:0;animation:rv .7s .4s forwards}
.pile{position:absolute;left:120px;top:262px;width:360px;height:250px}
.doc{position:absolute;width:220px;height:150px;border-radius:12px;background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.16);opacity:0;animation:fan .5s forwards}
.doc i{display:block;height:9px;border-radius:5px;background:rgba(255,255,255,.16);margin:16px 18px 0}
.doc i:nth-child(2){width:70%}.doc i:nth-child(3){width:85%}
.d1{left:0;top:56px;transform:rotate(-6deg);animation-delay:1.0s}
.d2{left:46px;top:34px;transform:rotate(3deg);animation-delay:1.2s}
.d3{left:96px;top:12px;transform:rotate(-2deg);animation-delay:1.4s}
.count{position:absolute;left:8px;top:-6px;background:rgba(109,124,255,.22);color:#c7d2ff;border:1px solid rgba(109,124,255,.45);
 border-radius:12px;padding:8px 18px;font-weight:800;font-size:22px;opacity:0;animation:rv .5s 1.7s forwards}
.stamp{position:absolute;left:600px;top:280px;border:9px solid #f0556f;color:#f0556f;border-radius:20px;padding:14px 34px;
 font-weight:900;font-size:72px;line-height:1;opacity:0;transform:rotate(-8deg);animation:pop .7s 2.6s forwards;
 text-shadow:0 3px 16px rgba(240,85,111,.4);box-shadow:0 0 50px rgba(240,85,111,.3) inset}
.q{position:absolute;left:960px;top:296px;font-size:64px;font-weight:900;color:#b9c6de;opacity:0;animation:rv .6s 3.6s forwards}
.cant{position:absolute;left:0;bottom:64px;width:100%;display:flex;justify-content:center;gap:26px}
.pill{position:relative;font-size:24px;font-weight:800;color:#cdd8ec;background:rgba(255,255,255,.05);
 border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 28px;opacity:0;animation:rv .5s forwards}
.pill::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:5px;border-radius:3px;background:#f0556f;
 transform:scaleX(0);transform-origin:left;animation:strike .4s forwards}
.c1{animation-delay:5.2s}.c1::after{animation-delay:5.7s}
.c2{animation-delay:6.0s}.c2::after{animation-delay:6.5s}
.c3{animation-delay:6.8s}.c3::after{animation-delay:7.3s}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="kick">Bienvenida &middot; para profesores</div>
<div class="title">Un profesor no puede actuar sobre un porcentaje</div>

<div class="pile">
 <div class="doc d1"><i></i><i></i><i></i></div>
 <div class="doc d2"><i></i><i></i><i></i></div>
 <div class="doc d3"><i></i><i></i><i></i></div>
 <div class="count">40 ensayos &middot; un domingo</div>
</div>

<div class="stamp">87% IA</div>
<div class="q">&iquest;y?</div>

<div class="cant">
 <div class="pill c1">acusar</div>
 <div class="pill c2">sancionar</div>
 <div class="pill c3">ni abrir la conversaci&oacute;n</div>
</div>
</body></html>
