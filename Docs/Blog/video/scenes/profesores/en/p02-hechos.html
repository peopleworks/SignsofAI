<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;
 background:radial-gradient(680px 420px at 82% -12%,rgba(47,210,122,.13),transparent 60%),
   radial-gradient(680px 420px at 12% -8%,rgba(109,124,255,.18),transparent 60%),
   linear-gradient(160deg,#0b1020,#111a2e);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.bmark{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
@keyframes rv{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:.22;filter:grayscale(1)}}
.kick{position:absolute;top:88px;width:100%;text-align:center;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#2fd27a;font-weight:800;opacity:0;animation:rv .6s .2s forwards}
.title{position:absolute;top:118px;width:100%;text-align:center;font-size:40px;font-weight:800;opacity:0;animation:rv .7s .4s forwards}
.verdict{position:absolute;left:120px;top:300px;width:280px;text-align:center;border:8px solid #f0556f;color:#f0556f;
 border-radius:20px;padding:26px 10px;font-weight:900;font-size:64px;transform:rotate(-6deg);
 opacity:0;animation:rv .6s 1.2s forwards, fade 1s 2.6s forwards}
.verdict small{display:block;font-size:20px;font-weight:800;color:#9fb0cc;margin-top:8px;letter-spacing:2px}
.arrow{position:absolute;left:452px;top:352px;font-size:66px;font-weight:900;color:#6d7cff;opacity:0;animation:rv .6s 2.8s forwards}
.list{position:absolute;left:560px;top:262px;width:600px}
.item{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
 border-radius:16px;padding:18px 22px;margin-bottom:18px;opacity:0;animation:rv .55s forwards}
.i1{animation-delay:3.4s}.i2{animation-delay:4.2s}.i3{animation-delay:5.0s}
.chk{flex:0 0 40px;height:40px}
.item .t{font-size:24px;font-weight:700}
.item .t small{display:block;font-size:18px;font-weight:600;color:#9fb0cc;margin-top:3px}
.i1 .t b{color:#f59e0b}.i2 .t b{color:#22b8cf}.i3 .t b{color:#f0556f}
.foot{position:absolute;left:0;bottom:56px;width:100%;text-align:center;font-size:26px;font-weight:800;color:#cdd8ec;
 opacity:0;animation:rv .6s 6.2s forwards}
.foot b{color:#2fd27a}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>
<div class="kick">What SignsOfAI does</div>
<div class="title">Evidence, not a verdict</div>

<div class="verdict">87%<small>VERDICT</small></div>
<div class="arrow">&rarr;</div>

<div class="list">
 <div class="item i1">
  <svg class="chk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#2fd27a" stroke-width="3"/><polyline points="12,21 18,27 29,14" fill="none" stroke="#2fd27a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="t"><b>A reference that doesn't exist</b><small>check it against the essay's own bibliography</small></div>
 </div>
 <div class="item i2">
  <svg class="chk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#2fd27a" stroke-width="3"/><polyline points="12,21 18,27 29,14" fill="none" stroke="#2fd27a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="t"><b>A foreign character &middot; line 14</b><small>check it in any editor</small></div>
 </div>
 <div class="item i3">
  <svg class="chk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#2fd27a" stroke-width="3"/><polyline points="12,21 18,27 29,14" fill="none" stroke="#2fd27a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="t"><b>Outside their baseline</b><small>compared with the student's own writing</small></div>
 </div>
</div>

<div class="foot">Facts you verify <b>without trusting us</b></div>
</body></html>
