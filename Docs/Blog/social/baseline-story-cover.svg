<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- The fifth article, in two measurements side by side.

       Left: one hundred essays by people writing in a second language, and the
       sixty-one that AI detectors flag as machine-written. Not sixty-one percent
       of the cheats. Sixty-one percent of the essays.

       Right: the same question asked differently — the writer's own earlier work
       as the scale, and the questioned text landing inside their own range.
       No threshold of ours appears here, because there isn't one. -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="46%" r="78%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d7cff" stop-opacity=".05"/>
      <stop offset="50%" stop-color="#6d7cff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#6d7cff" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="okGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0b1020"/>
  <rect width="1280" height="720" fill="url(#vignette)"/>

