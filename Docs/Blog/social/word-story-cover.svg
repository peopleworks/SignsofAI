<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!--
    The argument, not a screenshot of it: the pane produced a score and withheld the verdict,
    because the document sits in the region the boundary was never measured on.

    Every number here is real and comes from published-calibration.json and the first run inside
    Word: the corpus is 296 texts, its shortest is 649 words, the document was 357, the score was 0,
    and the character scan found six no-break spaces at a length where it still holds.

    The ruler is to scale — 357 and 649 are placed by their word counts, not by eye.
  -->
  <defs>
    <radialGradient id="vig" cx="42%" cy="44%" r="80%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="unmeasured" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1b2440" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#1b2440" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#0b1020"/>
  <rect width="1280" height="720" fill="url(#vig)"/>

  <!-- ── the claim ──────────────────────────────────────────────────────── -->
  <text x="96" y="96" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="20"
        letter-spacing="3.5" fill="#5c6785">A TASK PANE INSIDE WORD, ON A REAL DOCUMENT</text>
  <text x="96" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#e8ebee">It produced a score</text>
  <text x="96" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#e8ebee">and refused the verdict.</text>

  <!-- ── the ruler: where the boundary has evidence, and where it has none ─ -->
  <!-- Scale: 0 words at x=96, 1000 words at x=760. 357 → 333, 649 → 527. -->
  <rect x="96" y="336" width="431" height="118" fill="url(#unmeasured)"/>
  <text x="112" y="378" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17"
        letter-spacing="1.5" fill="#7b86a3">NO TEXT THIS SHORT WAS EVER MEASURED</text>

  <line x1="96" y1="454" x2="760" y2="454" stroke="#2a3350" stroke-width="2"/>

  <!-- the floor: the shortest text in the corpus -->
  <path d="M527 336 V486" stroke="#ffb454" stroke-width="2.5" stroke-opacity=".95"/>
  <text x="539" y="510" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="23"
        fill="#ffb454">649 words</text>
  <text x="539" y="538" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16"
        fill="#8a7a5a">the shortest of the 296 measured</text>

  <!-- the document that was actually open -->
  <circle cx="333" cy="454" r="9" fill="#f0556f"/>
  <path d="M333 454 V416" stroke="#f0556f" stroke-width="2" stroke-opacity=".7"/>
  <text x="333" y="404" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace"
        font-size="23" fill="#f0556f">357 words</text>
  <text x="333" y="490" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace"
        font-size="16" fill="#a35a68">the document</text>

  <text x="96" y="592" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#9aa4b0">
    Below the shortest text ever measured, a number means nothing.
  </text>
  <text x="96" y="626" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#9aa4b0">
    So it says so, and stops.
  </text>

  <!-- ── the pane, as it actually answered ──────────────────────────────── -->
  <rect x="852" y="96" width="332" height="530" rx="14" fill="#151b2c" stroke="#2a3350" stroke-width="2"/>

  <text x="884" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="19"
        font-weight="600" fill="#e8ebee">Signs of AI Writing</text>
  <line x1="884" y1="160" x2="1152" y2="160" stroke="#2a3350" stroke-width="1.5"/>

  <text x="884" y="196" font-family="'Segoe UI', system-ui, sans-serif" font-size="15"
        font-style="italic" fill="#7b86a3">Document 1.docx</text>

  <text x="884" y="272" font-family="'Segoe UI', system-ui, sans-serif" font-size="72"
        font-weight="800" fill="#e8ebee">0</text>
  <text x="932" y="272" font-family="'Segoe UI', system-ui, sans-serif" font-size="26"
        fill="#7b86a3">/100</text>

  <!-- where a verdict would be, and is not -->
  <rect x="884" y="296" width="268" height="42" rx="6" fill="none"
        stroke="#5c6785" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1018" y="323" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="17" fill="#9aa4b0">No verdict at this length</text>

  <text x="884" y="372" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" fill="#7b86a3">357 words · 21 sentences · 0 signals</text>

  <!-- the fact that survives at any length -->
  <line x1="884" y1="404" x2="1152" y2="404" stroke="#2a3350" stroke-width="1.5"/>
  <text x="884" y="442" font-family="'Segoe UI', system-ui, sans-serif" font-size="16"
        font-weight="600" fill="#e8ebee">Character artifacts</text>
  <text x="884" y="470" font-family="Consolas, monospace" font-size="15" fill="#22b8cf">U+00A0</text>
  <text x="972" y="470" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#9aa4b0">NO-BREAK SPACE</text>
  <text x="1152" y="470" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#22b8cf">×6</text>
  <text x="884" y="504" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#7b86a3">A fact about the file. It carries</text>
  <text x="884" y="524" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#7b86a3">no threshold, so it still holds.</text>

  <line x1="884" y1="556" x2="1152" y2="556" stroke="#2a3350" stroke-width="1.5"/>
  <text x="884" y="586" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#6d7cff">The document is never uploaded.</text>
  <text x="884" y="606" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#5c6785">There is nowhere to upload it to.</text>

  <text x="96" y="682" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16"
        letter-spacing="1.5" fill="#454f6b">SIGNSOFAI · FALSE-POSITIVE RATE 2 OF 296 AT 30/100, PUBLISHED</text>
</svg>
