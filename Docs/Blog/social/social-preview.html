<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1280px;height:640px;overflow:hidden;position:relative;
 background:radial-gradient(620px 480px at 92% 6%,rgba(47,210,122,.14),transparent 60%),
   radial-gradient(700px 560px at 4% 96%,rgba(219,39,119,.20),transparent 60%),
   radial-gradient(680px 520px at 26% -10%,rgba(109,124,255,.22),transparent 60%),
   linear-gradient(155deg,#0b1020,#0d1428 55%,#121c33);
 color:#eaf1fb;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
.brand{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:40px}
.bmark{width:56px;height:56px;border-radius:15px;background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 36px rgba(109,124,255,.5)}
.h1{position:absolute;left:64px;top:150px;width:640px;font-size:68px;font-weight:900;line-height:1.04;letter-spacing:-1.5px}
.h1 b{background:linear-gradient(90deg,#f59e0b,#2fd27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:absolute;left:64px;top:388px;width:660px;font-size:31px;line-height:1.35;color:#b9c6de}
.sub b{color:#eaf1fb}
.chips{position:absolute;left:64px;bottom:52px;display:flex;gap:14px}
.chip{padding:13px 24px;border-radius:999px;font-weight:800;font-size:25px;white-space:nowrap}
.c1{background:rgba(47,210,122,.14);color:#2fd27a;border:2px solid rgba(47,210,122,.38)}
.c2{background:rgba(109,124,255,.14);color:#9aa8ff;border:2px solid rgba(109,124,255,.38)}
.c3{background:rgba(245,158,11,.13);color:#f5b342;border:2px solid rgba(245,158,11,.36)}
.c4{background:rgba(34,184,207,.13);color:#5fd3e6;border:2px solid rgba(34,184,207,.36)}
.card{position:absolute;right:64px;top:150px;width:440px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
 border-radius:22px;padding:30px 32px;box-shadow:0 28px 70px rgba(0,0,0,.45)}
.ln{height:16px;border-radius:8px;margin:20px 0;background:rgba(255,255,255,.13)}
.hlp{background:linear-gradient(90deg,rgba(219,39,119,.85),rgba(219,39,119,.3))}
.hla{background:linear-gradient(90deg,rgba(245,158,11,.85),rgba(245,158,11,.3))}
.hlc{background:linear-gradient(90deg,rgba(34,184,207,.85),rgba(34,184,207,.3))}
.legend{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:700;color:#9fb0cc}
.dot{width:15px;height:15px;border-radius:5px}
.dp{background:#db2777} .da{background:#f59e0b} .dc{background:#22b8cf}
.url{position:absolute;right:64px;bottom:56px;font-size:26px;font-weight:700;color:#7c8aa6}
</style></head><body>
<div class="brand"><span class="bmark"></span> SignsOfAI</div>

<div class="h1">The AI-writing detector that <b>shows its work</b></div>
<div class="sub">Not a black-box percentage: <b>every tell highlighted</b>, with the fix.
 English &amp; Spanish, 100% in your browser.</div>

<div class="card">
 <div class="ln hlp" style="width:88%"></div>
 <div class="ln" style="width:97%"></div>
 <div class="ln hla" style="width:62%"></div>
 <div class="ln" style="width:92%"></div>
 <div class="ln hlc" style="width:76%"></div>
 <div class="legend">
  <span class="lg"><span class="dot dp"></span>Lexical</span>
  <span class="lg"><span class="dot da"></span>Rhetorical</span>
  <span class="lg"><span class="dot dc"></span>Syntactic</span>
 </div>
</div>

<div class="chips">
 <span class="chip c1">Free &amp; MIT</span>
 <span class="chip c2">EN + ES</span>
 <span class="chip c3">.NET 10 &middot; Blazor WASM</span>
</div>
<div class="url">peopleworks.github.io/SignsofAI</div>
</body></html>
