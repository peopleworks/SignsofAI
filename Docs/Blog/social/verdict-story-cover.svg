<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- The seventh article's argument in one frame: one document goes into one engine and comes back
       out as two answers that cannot both be true. The left panel speaks; the right one, reading the
       same text in the same run, refuses to.

       Wordless on purpose, like the fourth cover. The only tokens are numbers and the ≠, which read
       identically in English and Spanish, so one cover serves both editions. The verdict lines are
       drawn as bars rather than set as text for the same reason — the moment the cover says "Strong
       signs of AI writing" it stops being bilingual. -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="44%" r="80%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <radialGradient id="loudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0b1020"/>
  <rect width="1280" height="720" fill="url(#vignette)"/>

  <!-- One input, at the top, deliberately unremarkable: the whole point is that nothing about the
       document explains the disagreement. -->
  <g transform="translate(604 56)">
    <rect x="0" y="0" width="72" height="92" rx="8" fill="#141d33"
          stroke="#8b97b5" stroke-opacity=".5" stroke-width="2"/>
    <g fill="#8b97b5" fill-opacity=".45">
      <rect x="14" y="20" width="44" height="6" rx="3"/>
      <rect x="14" y="36" width="44" height="6" rx="3"/>
      <rect x="14" y="52" width="30" height="6" rx="3"/>
      <rect x="14" y="68" width="38" height="6" rx="3"/>
    </g>
  </g>

  <!-- It forks. Same engine, same run, same minute. -->
  <g fill="none" stroke="#8b97b5" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round">
    <path d="M640 156 v34"/>
    <path d="M640 190 C 640 214, 372 208, 372 240"/>
    <path d="M640 190 C 640 214, 908 208, 908 240"/>
  </g>

  <!-- ── Left: the command line. It answers, loudly. ──────────────────────────────────────────── -->
  <circle cx="372" cy="420" r="210" fill="url(#loudGlow)"/>
  <g>
    <rect x="132" y="248" width="480" height="352" rx="16" fill="#141d33" fill-opacity=".55"
          stroke="#f59e0b" stroke-opacity=".38" stroke-width="2"/>

    <text x="372" y="404" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif"
          font-size="132" font-weight="600" fill="#f59e0b">90</text>
    <text x="372" y="450" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif"
          font-size="34" fill="#f59e0b" fill-opacity=".55">/100</text>

    <!-- A verdict, stated: a solid bar where the sentence would sit. -->
    <rect x="212" y="496" width="320" height="18" rx="9" fill="#f59e0b" fill-opacity=".92"/>
    <rect x="252" y="530" width="240" height="10" rx="5" fill="#f59e0b" fill-opacity=".3"/>

    <!-- The findings it counted. -->
    <g fill="#f59e0b" fill-opacity=".55">
      <circle cx="292" cy="304" r="6"/><circle cx="316" cy="304" r="6"/><circle cx="340" cy="304" r="6"/>
      <circle cx="364" cy="304" r="6"/><circle cx="388" cy="304" r="6"/><circle cx="412" cy="304" r="6"/>
      <circle cx="436" cy="304" r="6"/>
    </g>
  </g>

  <!-- ── Right: the exported report. Same text. It says nothing. ─────────────────────────────── -->
  <g>
    <rect x="668" y="248" width="480" height="352" rx="16" fill="#141d33" fill-opacity=".35"
          stroke="#8b97b5" stroke-opacity=".22" stroke-width="2"/>

    <text x="908" y="404" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif"
          font-size="132" font-weight="600" fill="#8b97b5" fill-opacity=".75">90</text>
    <text x="908" y="450" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif"
          font-size="34" fill="#8b97b5" fill-opacity=".4">/100</text>

    <!-- Where the verdict would have gone. The outline is dashed and the line through it is the
         point of the whole article: not a low reading, an absent one. -->
    <rect x="748" y="496" width="320" height="18" rx="9" fill="none"
          stroke="#8b97b5" stroke-opacity=".45" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M770 505 h276" stroke="#8b97b5" stroke-opacity=".55" stroke-width="2.5"
          stroke-linecap="round"/>
    <rect x="788" y="530" width="240" height="10" rx="5" fill="#8b97b5" fill-opacity=".12"/>

    <g fill="#8b97b5" fill-opacity=".28">
      <circle cx="828" cy="304" r="6"/><circle cx="852" cy="304" r="6"/><circle cx="876" cy="304" r="6"/>
      <circle cx="900" cy="304" r="6"/><circle cx="924" cy="304" r="6"/><circle cx="948" cy="304" r="6"/>
      <circle cx="972" cy="304" r="6"/>
    </g>
  </g>

  <!-- The claim, in the one glyph that needs no translation.
       Sat level with the scores in the first draft, where it read as "90 ≠ 90" and looked like an
       error. The scores agree; it is the line underneath them that does not, so the glyph belongs
       there. -->
  <g transform="translate(640 505)">
    <circle cx="0" cy="0" r="46" fill="#0b1020" stroke="#e5484d" stroke-opacity=".8" stroke-width="2.5"/>
    <g stroke="#e5484d" stroke-width="5" stroke-linecap="round">
      <path d="M-20 -9 h40"/>
      <path d="M-20 9 h40"/>
      <path d="M-15 22 L15 -22"/>
    </g>
  </g>
</svg>
