       The vertical line is the shortest of them: 662 words. Everything left of it is a region the
       threshold was never measured on, and it is empty because the corpus has nothing there.
       The single pale point is a 66-word passage scoring 94 — the case the article is about.
       Plotted, not drawn: see scratchpad/make_length_cover.py and Docs/Calibration/corpus.json. -->
