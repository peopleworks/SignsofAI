<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:128px;height:128px;overflow:hidden;background:#0b1020;
 display:flex;align-items:center;justify-content:center}
.mark{width:104px;height:104px;border-radius:26px;
 background:conic-gradient(from 210deg,#db2777,#f59e0b,#22b8cf,#f0556f,#db2777);
 box-shadow:0 0 0 2px rgba(255,255,255,.16);position:relative;overflow:hidden}
.inner{position:absolute;inset:15px;border-radius:14px;background:#0b1020;
 display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 12px}
.ln{height:7px;border-radius:4px;background:rgba(255,255,255,.16)}
.a{background:#db2777;width:100%} .b{width:78%} .c{background:#f59e0b;width:60%} .d{background:#22b8cf;width:88%}
</style></head><body>
<div class="mark"><div class="inner">
 <div class="ln a"></div><div class="ln b"></div><div class="ln c"></div><div class="ln d"></div>
</div></div>
</body></html>
