<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- The eighth article's finding, drawn rather than described: one page of writing by one
       person, and three four-hundred-word windows laid over it at different places. The same
       text, the same author, the same afternoon — and the verdict changes depending on which
       window somebody happened to pick up.

       Wordless on purpose, like the fourth and seventh covers, so a single image serves both
       the Spanish and the English edition. The only glyphs are a score and two states, which
       read the same in either language.

       The page is deliberately monotonous where the flagged window falls and varied where the
       clean ones do: that is the mechanism itself, sentence-length variation, and a reader who
       looks twice can see the cause without being told it. -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#dfe6f2"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1090" cy="-40" r="300" fill="#6d7cff" opacity="0.13"/>
  <circle cx="150" cy="760" r="280" fill="#f0556f" opacity="0.10"/>

  <!-- ── the page: one document, written by one person ─────────────────────────────── -->
  <g filter="url(#lift)">
    <rect x="112" y="96" width="470" height="500" rx="10" fill="url(#paper)"/>
  </g>

  <!-- Lines of prose. Their varying lengths are the whole point, so they are drawn to a
       measured rhythm rather than at random: long, long, short, very long, fragment. -->
  <g fill="#9aa8c2">
    <rect x="150" y="132" width="392" height="9" rx="4.5"/>
    <rect x="150" y="156" width="356" height="9" rx="4.5"/>
    <rect x="150" y="180" width="118" height="9" rx="4.5"/>
    <rect x="150" y="204" width="404" height="9" rx="4.5"/>
    <rect x="150" y="228" width="230" height="9" rx="4.5"/>
    <rect x="150" y="252" width="61" height="9" rx="4.5"/>

    <!-- The stretch the flagged window lands on: every line the same width. Nobody wrote it
         differently — it is simply a passage where the sentences happen to run even. -->
    <rect x="150" y="288" width="330" height="9" rx="4.5"/>
    <rect x="150" y="312" width="338" height="9" rx="4.5"/>
    <rect x="150" y="336" width="326" height="9" rx="4.5"/>
    <rect x="150" y="360" width="334" height="9" rx="4.5"/>
    <rect x="150" y="384" width="330" height="9" rx="4.5"/>

    <rect x="150" y="420" width="404" height="9" rx="4.5"/>
    <rect x="150" y="444" width="96" height="9" rx="4.5"/>
    <rect x="150" y="468" width="368" height="9" rx="4.5"/>
    <rect x="150" y="492" width="252" height="9" rx="4.5"/>
    <rect x="150" y="516" width="70" height="9" rx="4.5"/>
    <rect x="150" y="540" width="392" height="9" rx="4.5"/>
    <rect x="150" y="564" width="180" height="9" rx="4.5"/>
  </g>

  <!-- ── three windows over the same page ──────────────────────────────────────────── -->
  <!-- Clean: the opening, where the rhythm is uneven. -->
  <rect x="130" y="118" width="434" height="158" rx="8" fill="none" stroke="#2fd27a" stroke-width="4"/>
  <g transform="translate(596,178)">
    <circle r="22" fill="#2fd27a" opacity="0.16"/>
    <path d="M-9 1 l6 7 l13 -15" fill="none" stroke="#2fd27a" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flagged: the even stretch, and nothing else about it differs. -->
  <rect x="130" y="274" width="434" height="134" rx="8" fill="none" stroke="#f0556f" stroke-width="5"/>
  <g transform="translate(596,341)">
    <circle r="24" fill="#f0556f" opacity="0.18"/>
    <path d="M0 -12 v14" stroke="#f0556f" stroke-width="5" stroke-linecap="round"/>
    <circle cy="9" r="3" fill="#f0556f"/>
  </g>

  <!-- Clean again: further down. -->
  <rect x="130" y="406" width="434" height="158" rx="8" fill="none" stroke="#2fd27a" stroke-width="4"/>
  <g transform="translate(596,466)">
    <circle r="22" fill="#2fd27a" opacity="0.16"/>
    <path d="M-9 1 l6 7 l13 -15" fill="none" stroke="#2fd27a" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── the three readings, as a ledger ───────────────────────────────────────────── -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- Three windows, three answers, one text. The scores are the shape of the real
         distribution, not invented: clean windows sit low, the flagged one clears 25. -->
    <g transform="translate(700,150)">
      <rect x="0" y="0" width="452" height="112" rx="14" fill="#ffffff" opacity="0.05"/>
      <rect x="0" y="0" width="452" height="112" rx="14" fill="none" stroke="#2fd27a"
            stroke-opacity="0.45" stroke-width="2"/>
      <text x="30" y="52" fill="#2fd27a" font-size="46" font-weight="800">6</text>
      <text x="80" y="52" fill="#7f8ca6" font-size="26" font-weight="700">/100</text>
      <text x="30" y="86" fill="#b9c6de" font-size="21" font-weight="600">no verdict</text>
    </g>

    <g transform="translate(700,286)">
      <rect x="0" y="0" width="452" height="126" rx="14" fill="#f0556f" opacity="0.12"/>
      <rect x="0" y="0" width="452" height="126" rx="14" fill="none" stroke="#f0556f" stroke-width="3"/>
      <text x="30" y="60" fill="#f0556f" font-size="56" font-weight="800">31</text>
      <text x="98" y="60" fill="#7f8ca6" font-size="26" font-weight="700">/100</text>
      <text x="30" y="96" fill="#f0556f" font-size="21" font-weight="700">flagged</text>
    </g>

    <g transform="translate(700,436)">
      <rect x="0" y="0" width="452" height="112" rx="14" fill="#ffffff" opacity="0.05"/>
      <rect x="0" y="0" width="452" height="112" rx="14" fill="none" stroke="#2fd27a"
            stroke-opacity="0.45" stroke-width="2"/>
      <text x="30" y="52" fill="#2fd27a" font-size="46" font-weight="800">9</text>
      <text x="80" y="52" fill="#7f8ca6" font-size="26" font-weight="700">/100</text>
      <text x="30" y="86" fill="#b9c6de" font-size="21" font-weight="600">no verdict</text>
    </g>

    <!-- The brace that carries the argument: all three are the same author, the same page. -->
    <path d="M1178 152 q16 0 16 18 v146 q0 18 16 18 q-16 0 -16 18 v146 q0 18 -16 18"
          fill="none" stroke="#6d7cff" stroke-width="3" stroke-linecap="round"/>
    <text x="1236" y="360" fill="#6d7cff" font-size="22" font-weight="800"
          text-anchor="middle" transform="rotate(90 1236 360)">ONE WRITER · ONE PAGE</text>
  </g>

  <!-- ── mark ──────────────────────────────────────────────────────────────────────── -->
  <!-- Placed clear of the page rather than over it: the first render put the mark on top of the
       paper, which read as a smudge on the very artefact the cover is arguing about. -->
  <g transform="translate(700,590)" font-family="Segoe UI, system-ui, sans-serif">
    <rect x="0" y="0" width="26" height="26" rx="7" fill="#6d7cff"/>
    <text x="40" y="20" fill="#8fa0c0" font-size="20" font-weight="700">SignsOfAI</text>
  </g>
</svg>
