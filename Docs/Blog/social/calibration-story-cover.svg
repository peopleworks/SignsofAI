  <!-- The sixth article's result, plotted exactly as published: ninety texts that
       predate generative models, none of them reaching the recommended threshold.

       The dots are placed from a fixed seed and follow the distribution in
       Docs/CALIBRATION.md — medians between 5.2 and 7.7, ninetieth percentiles
       between 9.8 and 15.4 — and the single highest point is the real one, 23.4.
       The gap between that point and the line is the whole finding, and it is
       narrow on purpose: this is a claim of 0% to 4.1%, not a claim of zero. -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="46%" r="78%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#0b1020"/>
  <rect width="1280" height="720" fill="url(#vignette)"/>

  <!-- The threshold. Nothing crosses it. -->
  <path d="M120 226.0 H1180" stroke="#3ecf8e" stroke-width="2.5"
        stroke-dasharray="10 8" stroke-opacity=".85"/>
  <text x="1180" y="208.0" text-anchor="end"
        font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26"
        fill="#3ecf8e">25 / 100</text>

