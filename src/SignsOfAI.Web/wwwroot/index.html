<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signs of AI Writing — detect & de-AI-ify your text</title>
    <meta name="description" content="Free, privacy-first tool that flags the tells of AI writing and tells you how to fix each one. Runs 100% in your browser." />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- The interface lives in the SignsOfAI.UI class library, shared with the desktop app; a Razor
         class library serves its wwwroot under _content/{assembly}/. Paths stay relative so the
         GitHub Pages deploy, which rewrites <base href> to /<repo>/, still resolves them. -->
    <link rel="stylesheet" href="_content/SignsOfAI.UI/css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
    <link rel="mask-icon" href="favicon.svg?v=2" color="#2563eb" />
    <link href="SignsOfAI.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/SignsOfAI.UI/js/lang.js"></script>
    <script src="_content/SignsOfAI.UI/js/share-card.js"></script>
    <!-- autostart="false" so boot.js can start Blazor itself: it retries a boot file the
         server fails to hand over, and explains the failure if it still will not come. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script src="js/boot.js"></script>
</body>

</html>
